<div id="chat-widget" class="chat-widget chat-widget--collapsed">
  <button id="chat-toggle" class="chat-toggle" type="button" title="Open Grid Assistant" aria-label="Open Grid Assistant">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-panel">
    <div class="chat-panel__header">
      <div class="chat-panel__title">
        <span class="live-dot"></span>
        <span class="mono-label accent-label">Grid Assistant</span>
      </div>
      <button id="chat-close" class="chat-panel__close" type="button" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="chat-messages" class="chat-panel__messages"></div>
    <form id="chat-form" class="chat-panel__input">
      <input type="text" id="chat-input" placeholder="Ask about grids, power flow..." autocomplete="off">
      <button id="chat-send" class="chat-send" type="submit" aria-label="Send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
    </form>
  </div>
</div>
